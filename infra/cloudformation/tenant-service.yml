AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Everything one clinic needs, in one stack: its coordination table, its log
  group, its five secret containers, its least-privilege ECS roles, its ECS
  service and target group, and the host rule that routes its hostname on the
  shared load balancer. One stack per clinic per environment.

  Isolation is structural. A clinic's task can read exactly its own five secrets
  and write exactly its own coordination table, so a bug in this codebase cannot
  reach another clinic's patient data — the process never holds the credentials.

  Deploy infra/cloudformation/shared-alb.yml first; this stack imports its
  listener and security group.

  NEVER SUBMITTED TO AWS. The networking parameters and the bootstrap task
  definition must come from the real account first — see docs/INFRASTRUCTURE.md.
  Intrinsic functions use full form (Fn::Sub / Ref) so the template is parseable
  and testable offline.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
    Description: Deployment environment. Controls naming, retention and deletion protection.
  ServiceName:
    Type: String
    Default: ai-receptionist
    AllowedPattern: '^[a-z][a-z0-9-]{2,40}$'
    Description: >
      Lowercase slug used to name every resource this clinic owns. Clinic #1 keeps
      "ai-receptionist" because its table, secrets and roles already exist in the
      account under that name; every clinic onboarded afterwards uses its tenant
      slug, so its resources are named after it.
  TenantSlug:
    Type: String
    AllowedPattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    Description: The clinic this stack serves. Must match a tenants/<slug>.json.
  HostName:
    Type: String
    AllowedPattern: '^[a-z0-9.-]+$'
    Description: The hostname this clinic answers on, e.g. api.amityvillewellness.com.
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:\d{12}:certificate/[a-f0-9-]+$'
    Description: This clinic's certificate, attached to the shared HTTPS listener.
  ListenerRulePriority:
    Type: Number
    MinValue: 1
    MaxValue: 50000
    Description: Unique priority for this clinic's host rule on the shared listener.
  HttpsListenerArn:
    Type: String
    Description: HttpsListenerArn output of the shared-alb stack.
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: LoadBalancerSecurityGroupId output of the shared-alb stack.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the task runs in.
  TaskSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the Fargate task. Private subnets with a NAT route are preferred.
  AssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >
      ENABLED only when the task sits in a public subnet with no NAT gateway. The
      task still accepts traffic from the load balancer's security group alone.
  ClusterName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9][a-zA-Z0-9-_]{0,254}$'
    Description: ECS cluster to run in. Clusters cost nothing, so several clinics may share one.
  CreateCluster:
    Type: String
    AllowedValues: ['yes', 'no']
    Default: 'no'
    Description: >
      Whether this stack declares the cluster. Set from ownership, not existence:
      yes when this stack already owns the cluster or nothing owns it, no only
      when the cluster exists outside this stack. Flipping yes -> no for a
      cluster this stack owns deletes it.
  BootstrapTaskDefinitionArn:
    Type: String
    Default: ''
    Description: >
      Task definition the service is created with. Leave empty on the first pass
      to create everything except the service, then register a task definition
      with infra/render.mjs and set this. Afterwards deploys go through
      ecs update-service; re-running this stack would roll the service back to
      whatever revision this parameter names, so keep it current or leave the
      service alone.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Task count. A voice backend is idle most of the day.
  GitHubRepository:
    Type: String
    Default: cyrus444v/amityville-ai-receptionist
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: owner/repo permitted to assume the deploy role via OIDC.
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ['yes', 'no']
    Default: 'no'
    Description: >
      Whether this stack declares GitHub's account-global OIDC provider. Creating
      it twice fails, so this is no when another stack owns it — but yes, not no,
      when this stack owns it. Flipping yes -> no deletes the provider and every
      deploy role trusting it stops validating tokens.
  CreateDeployRole:
    Type: String
    AllowedValues: ['yes', 'no']
    Default: 'yes'
    Description: Create the GitHub Actions deploy role for this environment.

Mappings:
  EnvironmentConfig:
    staging:
      LogRetentionDays: 30
      DeletionProtection: false
      PointInTimeRecovery: false
    production:
      LogRetentionDays: 365
      DeletionProtection: true
      PointInTimeRecovery: true

Conditions:
  IsProduction:
    Fn::Equals: [{ Ref: EnvironmentName }, 'production']
  ShouldCreateOidcProvider:
    Fn::Equals: [{ Ref: CreateGitHubOidcProvider }, 'yes']
  ShouldCreateDeployRole:
    Fn::Equals: [{ Ref: CreateDeployRole }, 'yes']
  ShouldCreateCluster:
    Fn::Equals: [{ Ref: CreateCluster }, 'yes']
  HasBootstrapTaskDefinition:
    Fn::Not:
      - Fn::Equals: [{ Ref: BootstrapTaskDefinitionArn }, '']

Resources:

  # ------------------------------------------------------------------
  # Shared coordination store: slot reservations, idempotency claims,
  # mutation state and rate-limit counters. Keys are SHA-256 digests,
  # so no patient identifier is ever persisted here.
  # ------------------------------------------------------------------
  CoordinationTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName:
        Fn::Sub: '${ServiceName}-${EnvironmentName}-coordination'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled:
          Fn::FindInMap: [EnvironmentConfig, { Ref: EnvironmentName }, PointInTimeRecovery]
      DeletionProtectionEnabled:
        Fn::FindInMap: [EnvironmentConfig, { Ref: EnvironmentName }, DeletionProtection]
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: { Ref: ServiceName }
        - Key: Tenant
          Value: { Ref: TenantSlug }
        - Key: Environment
          Value: { Ref: EnvironmentName }
        - Key: DataClass
          Value: coordination-digests-only

  LogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: '/ecs/${ServiceName}-${EnvironmentName}'
      RetentionInDays:
        Fn::FindInMap: [EnvironmentConfig, { Ref: EnvironmentName }, LogRetentionDays]

  # ------------------------------------------------------------------
  # Secret containers. Values are never set by this template except the
  # two secrets CloudFormation can generate itself, which keeps them out
  # of any human clipboard, shell history or agent transcript.
  # ------------------------------------------------------------------
  ToolAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${ServiceName}/${EnvironmentName}/TOOL_AUTH_SECRET'
      Description: Shared secret Retell must send in the tool auth header.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: false

  AppointmentTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${ServiceName}/${EnvironmentName}/APPOINTMENT_TOKEN_SECRET'
      Description: HMAC key for short-lived, caller-bound appointment selection tokens.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: false

  RetellWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${ServiceName}/${EnvironmentName}/RETELL_WEBHOOK_SECRET'
      Description: >
        Retell signing key used to verify X-Retell-Signature against the exact
        raw request body. Operator-supplied; this stack never sets the value.

  GoogleCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${ServiceName}/${EnvironmentName}/GOOGLE_CREDENTIALS_BASE64'
      Description: >
        Base64 service-account JSON. Operator-supplied. Rotate the previously
        exposed key in Google Cloud before storing a value here.

  ResendApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${ServiceName}/${EnvironmentName}/RESEND_API_KEY'
      Description: Resend API key for confirmation email. Operator-supplied, optional.

  # ------------------------------------------------------------------
  # ECS roles. The execution role may read exactly these five secrets.
  # The task role may touch exactly one DynamoDB table.
  # ------------------------------------------------------------------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: '${ServiceName}-${EnvironmentName}-task-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-service-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - { Ref: ToolAuthSecret }
                  - { Ref: AppointmentTokenSecret }
                  - { Ref: RetellWebhookSecret }
                  - { Ref: GoogleCredentialsSecret }
                  - { Ref: ResendApiKeySecret }
        - PolicyName: write-service-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: '${LogGroup.Arn}:*'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: '${ServiceName}-${EnvironmentName}-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: coordination-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:TransactWriteItems
                  - dynamodb:Scan
                Resource:
                  - { 'Fn::GetAtt': [CoordinationTable, Arn] }

  # ------------------------------------------------------------------
  # GitHub Actions deploy identity. Short-lived OIDC credentials replace
  # long-lived AWS access keys. The trust policy is scoped to one repo
  # and one GitHub environment, so a staging workflow cannot deploy
  # production.
  # ------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateDeployRole
    Properties:
      RoleName:
        Fn::Sub: '${ServiceName}-${EnvironmentName}-github-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub':
                  Fn::Sub: 'repo:${GitHubRepository}:environment:${EnvironmentName}'
      Policies:
        - PolicyName: push-image-and-roll-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  Fn::Sub: 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ServiceName}-backend'
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource:
                  Fn::Sub: 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ServiceName}-backend'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - { 'Fn::GetAtt': [TaskExecutionRole, Arn] }
                  - { 'Fn::GetAtt': [TaskRole, Arn] }
                Condition:
                  StringEquals:
                    'iam:PassedToService': ecs-tasks.amazonaws.com

  # ------------------------------------------------------------------
  # Compute and networking. This is what voice-agent-core.yml was
  # missing: without it the deploy workflow had no service to update.
  # ------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Condition: ShouldCreateCluster
    Properties:
      ClusterName: { Ref: ClusterName }
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # The task accepts traffic from the shared load balancer and from nothing
  # else, so one clinic's service is unreachable from another clinic's.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        Fn::Sub: '${ServiceName}-${EnvironmentName} task'
      VpcId: { Ref: VpcId }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: { Ref: LoadBalancerSecurityGroupId }
          Description: Application traffic from the shared load balancer only.
      Tags:
        - Key: Tenant
          Value: { Ref: TenantSlug }
        - Key: Environment
          Value: { Ref: EnvironmentName }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name:
        Fn::Sub: '${ServiceName}-${EnvironmentName}-tg'
      VpcId: { Ref: VpcId }
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      # /health is the one unauthenticated, non-mutating endpoint the app
      # exposes, which is exactly what a health check should call.
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Tenant
          Value: { Ref: TenantSlug }
        - Key: Environment
          Value: { Ref: EnvironmentName }

  # This clinic's certificate, added to the shared listener rather than
  # replacing its default.
  ListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Properties:
      ListenerArn: { Ref: HttpsListenerArn }
      Certificates:
        - CertificateArn: { Ref: CertificateArn }

  # Host-based routing is what makes one load balancer serve every clinic.
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: { Ref: HttpsListenerArn }
      Priority: { Ref: ListenerRulePriority }
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - { Ref: HostName }
      Actions:
        - Type: forward
          TargetGroupArn: { Ref: TargetGroup }

  Service:
    Type: AWS::ECS::Service
    Condition: HasBootstrapTaskDefinition
    DependsOn:
      - ListenerRule
    Properties:
      ServiceName:
        Fn::Sub: '${ServiceName}-backend'
      # Referencing the resource, not the parameter, when this stack owns the
      # cluster: a Ref to the parameter is just a string, so CloudFormation would
      # see no edge between service and cluster and could create the service
      # first. A run with CreateCluster=yes and a bootstrap task definition in
      # one pass fails that way.
      Cluster:
        Fn::If:
          - ShouldCreateCluster
          - { Ref: Cluster }
          - { Ref: ClusterName }
      TaskDefinition: { Ref: BootstrapTaskDefinitionArn }
      DesiredCount: { Ref: DesiredCount }
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: { Ref: AssignPublicIp }
          Subnets: { Ref: TaskSubnetIds }
          SecurityGroups:
            - { Ref: TaskSecurityGroup }
      LoadBalancers:
        - ContainerName:
            Fn::Sub: '${ServiceName}-backend'
          ContainerPort: 8080
          TargetGroupArn: { Ref: TargetGroup }
      Tags:
        - Key: Tenant
          Value: { Ref: TenantSlug }
        - Key: Environment
          Value: { Ref: EnvironmentName }
      PropagateTags: SERVICE

Outputs:
  CoordinationTableName:
    Description: Value for COORDINATION_TABLE.
    Value: { Ref: CoordinationTable }
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-CoordinationTableName'
  LogGroupName:
    Description: Value for the awslogs-group log configuration option.
    Value: { Ref: LogGroup }
  TaskExecutionRoleArn:
    Value: { 'Fn::GetAtt': [TaskExecutionRole, Arn] }
  TaskRoleArn:
    Value: { 'Fn::GetAtt': [TaskRole, Arn] }
  DeployRoleArn:
    Condition: ShouldCreateDeployRole
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable on the GitHub environment.
    Value: { 'Fn::GetAtt': [DeployRole, Arn] }
  ToolAuthSecretArn:
    Value: { Ref: ToolAuthSecret }
  AppointmentTokenSecretArn:
    Value: { Ref: AppointmentTokenSecret }
  RetellWebhookSecretArn:
    Value: { Ref: RetellWebhookSecret }
  GoogleCredentialsSecretArn:
    Value: { Ref: GoogleCredentialsSecret }
  ResendApiKeySecretArn:
    Value: { Ref: ResendApiKeySecret }
  TargetGroupArn:
    Description: Target group the deploy workflow registers tasks into.
    Value: { Ref: TargetGroup }
  TaskSecurityGroupId:
    Value: { Ref: TaskSecurityGroup }
  ServiceHostName:
    Description: The hostname this clinic's Retell agent must call.
    Value: { Ref: HostName }
  ProductionGuard:
    Condition: IsProduction
    Description: Marker output confirming production retention and deletion protection are on.
    Value: retention-365d-pitr-on-deletion-protected
