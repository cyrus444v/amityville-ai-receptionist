AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Shared application load balancer for every clinic in this account. One stack per
  environment, not per clinic: the load balancer is the fixed cost of the business
  and it amortises across tenants, while each clinic keeps its own ECS service,
  its own coordination table and its own secrets. Host-based listener rules route
  api.<clinic>.<domain> to the right service.

  NEVER SUBMITTED TO AWS. The VPC, subnet and certificate parameters must be
  filled from the real account before this is validated or deployed — see
  docs/INFRASTRUCTURE.md.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [staging, production]
    Description: Deployment environment. One shared load balancer per environment.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the load balancer lives in.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones.
  DefaultCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:\d{12}:certificate/[a-f0-9-]+$'
    Description: >
      Certificate for the listener's default. Each clinic attaches its own
      certificate to this listener from its tenant-service stack, so this one only
      has to cover the default host.
  IdleTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 30
    MaxValue: 300
    Description: A voice tool call is short; a long idle timeout only holds sockets open.

Mappings:
  EnvironmentConfig:
    # Quoted on purpose: these feed LoadBalancerAttributes, whose Value is typed
    # String. CloudFormation does coerce an unquoted YAML boolean here — the
    # staging stack was created that way — but the explicit string is what the
    # property actually takes, so the template says what it means.
    staging:
      DeletionProtection: 'false'
    production:
      DeletionProtection: 'true'

Resources:

  # ------------------------------------------------------------------
  # Only 443 is reachable from the internet. Port 80 exists solely to
  # redirect, so a mistyped http:// URL does not silently fail.
  # ------------------------------------------------------------------
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription:
        Fn::Sub: 'Shared voice-agent load balancer (${EnvironmentName})'
      VpcId: { Ref: VpcId }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from the public internet.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP, redirected to HTTPS.
      Tags:
        - Key: Environment
          Value: { Ref: EnvironmentName }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name:
        Fn::Sub: 'voice-agent-${EnvironmentName}'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: { Ref: PublicSubnetIds }
      SecurityGroups:
        - { Ref: LoadBalancerSecurityGroup }
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          # Fn::Sub, not Ref: the parameter is a Number and this property is a
          # String. CloudFormation coerces it; this states the type outright.
          Value:
            Fn::Sub: '${IdleTimeoutSeconds}'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value:
            Fn::FindInMap: [EnvironmentConfig, { Ref: EnvironmentName }, DeletionProtection]
      Tags:
        - Key: Environment
          Value: { Ref: EnvironmentName }

  # ------------------------------------------------------------------
  # The default action is a 404, not a forward. An unrecognised host must
  # never land on some other clinic's service.
  # ------------------------------------------------------------------
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: { Ref: LoadBalancer }
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: { Ref: DefaultCertificateArn }
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"error":"unknown host"}'

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: { Ref: LoadBalancer }
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

Outputs:
  LoadBalancerArn:
    Value: { Ref: LoadBalancer }
    Export:
      Name:
        Fn::Sub: 'voice-agent-${EnvironmentName}-LoadBalancerArn'
  LoadBalancerDnsName:
    Description: >
      Point each clinic's api.<clinic> record at this name. For clinic #1 that is a
      CNAME created at GoDaddy, not a Route53 alias — see the "Current AWS reality"
      section of docs/INFRASTRUCTURE.md.
    Value: { 'Fn::GetAtt': [LoadBalancer, DNSName] }
    Export:
      Name:
        Fn::Sub: 'voice-agent-${EnvironmentName}-LoadBalancerDnsName'
  LoadBalancerHostedZoneId:
    Description: >
      For a Route53 alias record, if a clinic's domain is hosted there. Clinic #1's
      is not; this stack creates no DNS records either way.
    Value: { 'Fn::GetAtt': [LoadBalancer, CanonicalHostedZoneID] }
    Export:
      Name:
        Fn::Sub: 'voice-agent-${EnvironmentName}-LoadBalancerHostedZoneId'
  HttpsListenerArn:
    Description: Each tenant-service stack adds one host rule to this listener.
    Value: { Ref: HttpsListener }
    Export:
      Name:
        Fn::Sub: 'voice-agent-${EnvironmentName}-HttpsListenerArn'
  LoadBalancerSecurityGroupId:
    Description: Each clinic's task security group accepts traffic from this group only.
    Value: { Ref: LoadBalancerSecurityGroup }
    Export:
      Name:
        Fn::Sub: 'voice-agent-${EnvironmentName}-LoadBalancerSecurityGroupId'
